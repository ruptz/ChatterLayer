# ChatterLayer packaging configuration
#
# Kept in YAML rather than package.json so the non-obvious decisions can carry
# comments explaining themselves — several of them are load-bearing.

appId: com.ruptz.chatterlayer
productName: ChatterLayer
copyright: Copyright © ChatterLayer contributors. MIT licensed.

directories:
  output: dist
  buildResources: build

# Application source. Production node_modules are included automatically.
files:
  - src/**/*
  - web/**/*
  - package.json
  # buildResources otherwise stays outside the app. The tray loads this one at
  # runtime, so it has to be inside the asar as well as being the build icon.
  - build/icon.png
  - '!**/*.map'
  - '!**/{.DS_Store,Thumbs.db}'

  # onnxruntime-node installs 246 MB: a CPU library for all six
  # platform/arch combinations, plus a DirectML provider. ChatterLayer asks for
  # the CPU execution provider only (see src/engine/stt/onnx.js), so the GPU
  # libraries are 38 MB of dead weight on Windows alone. The per-platform
  # sections below drop the architectures not being built.
  - '!node_modules/onnxruntime-node/bin/napi-v6/*/*/{DirectML,dxcompiler,dxil}.dll'
  - '!node_modules/onnxruntime-node/{script,dist/**/*.map}'

# libvosk ships inside the installer:
#   - every speech model needs it, so downloading it later only adds a way to fail
#   - it is platform-specific, so it must be chosen at build time
#   - it lives OUTSIDE the asar archive because koffi.load() needs a real file
#     path on disk; a library inside an asar cannot be dlopen'd
#
# Speech models are deliberately NOT bundled. They range from 40 MB to 2.3 GB,
# each user needs exactly one, and the app downloads the chosen model on first
# run into the user's data directory.
extraResources:
  - from: vendor
    to: vendor
    filter:
      - '**/*'
      # The upstream archive also carries a static link library and the C
      # header. Neither is used at runtime and the .lib alone is ~16 MB.
      - '!**/*.lib'
      - '!**/*.h'

asar: true

# Native binaries must be unpacked to be loadable. electron-builder's smart
# unpacking usually catches these, but koffi and davey are stated explicitly
# because a miss here fails at runtime, not at build time.
#
# onnxruntime-node needs the whole directory, not just the .node file: the
# binding pulls in onnxruntime.dll as an ordinary shared-library dependency, so
# the OS loader has to find it as a real file next to the binding. Unpacking
# only '**/*.node' leaves the library inside the asar and loading fails.
asarUnpack:
  - '**/node_modules/koffi/**'
  - '**/node_modules/@snazzah/**'
  - '**/node_modules/onnxruntime-node/**'
  - '**/*.node'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  artifactName: ${productName}-${version}-Setup.${ext}
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'

nsis:
  # A normal installer rather than a one-click one: streamers often want to
  # choose the install location, and the app writes models to userData anyway.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChatterLayer
  uninstallDisplayName: ChatterLayer
  # Downloaded models live in userData and can be several GB. Deleting them on
  # uninstall would be a nasty surprise for anyone reinstalling.
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.utilities
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}/**'

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: AudioVideo
  maintainer: ruptz
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,darwin}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/arm64/**'

publish:
  - provider: github
    releaseType: release
