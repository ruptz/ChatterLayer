version: 2

# Weekly is frequent enough for a project that ships on tags, not on merge.
updates:
  # The app itself. Watch songbird and davey closely: voice receive isn't
  # officially supported by Discord, and DAVE changes have broken it before.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Minor and patch bumps arrive as one PR, so a busy week of crate
    # releases costs one CI run instead of one per crate. Majors stay
    # separate so they get read.
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  # The root holds only build tools (the Tauri CLI, ESLint).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the noisy low-risk stuff; majors and the big ones stay
      # separate so they get read.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # A new compiler major buys users nothing; move when there's a reason to.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The site is a Next.js app on the public internet, so it gets watched even
  # though it ships no binaries. Its lockfile is separate from the app's.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # These describe the Node that Vercel runs, not the newest one.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
