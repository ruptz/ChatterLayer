name: Release

# Builds installers for every platform and attaches them to a GitHub Release.
#
# To cut a release:
#   1. bump "version" in package.json
#   2. git tag v1.0.1 && git push origin v1.0.1
#
# Running it manually from the Actions tab:
#   - with a tag  -> builds and publishes a draft release for that tag
#   - no tag      -> builds artifacts only; the release job is skipped, because
#                    a release cannot be created without a tag to attach to

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        # A release needs a tag to attach to. Running this manually from a
        # branch with no tag produces build artifacts only — it cannot create a
        # release, because there is nothing to name it after.
        description: 'Tag to publish (e.g. v1.0.1). Leave blank to build artifacts only.'
        required: false
        type: string

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # actions/attest-build-provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            script: dist:win
            attest: dist/*.exe
            artifacts: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: macos-latest
            name: macOS
            script: dist:mac
            attest: dist/*.dmg
            artifacts: |
              dist/*.dmg
              dist/*.dmg.blockmap
              dist/latest-mac.yml
          - os: ubuntu-latest
            name: Linux
            script: dist:linux
            attest: |
              dist/*.AppImage
              dist/*.deb
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run self test
        run: npm run selftest

      # Speech models are NOT bundled — they are 40 MB to 2.3 GB and the app
      # downloads the one the user picks on first run. Only the libvosk
      # runtime ships inside the installer.
      - name: Fetch Vosk runtime for this platform
        run: npm run setup -- --runtime-only

      - name: Generate icon
        run: npm run icon

      - name: Build installers
        # --publish never: assets are collected and released in the job below,
        # so all platforms land in a single release.
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds. Add CSC_LINK / CSC_KEY_PASSWORD (Windows) or
          # macOS signing secrets here when certificates are available.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Cryptographic provenance: what built this file, from which commit and
      # workflow. Free and GitHub-native; `gh attestation verify <file>` checks
      # it. Does not need a signing certificate.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ matrix.attest }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatterlayer-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only run when there is an actual tag to release. On a tag push that's
    # github.ref_name; on a manual run it's whatever was typed in.
    if: github.ref_type == 'tag' || inputs.tag

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag to publish
        id: tag
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag to release. Push a v* tag, or supply one when running manually."
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lah artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Passed explicitly. Left to the action's default it reads github.ref,
          # which is a branch ref on a manual run and fails with
          # "Missing tag_name parameter".
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          draft: true # review before it goes public
          generate_release_notes: true
          name: ChatterLayer ${{ steps.tag.outputs.name }}
          body: |
            ## ChatterLayer ${{ steps.tag.outputs.name }}

            Live, colour-coded Discord voice captions for OBS. Free and fully
            offline — speech recognition runs on your own machine. No API keys,
            no accounts, no per-minute billing.

            ### Download

            | Platform | File |
            |---|---|
            | Windows (installer) | `ChatterLayer-*-Setup.exe` |
            | Windows (portable) | `ChatterLayer-*-portable.exe` |
            | macOS | `ChatterLayer-*.dmg` |
            | Linux | `ChatterLayer-*.AppImage` or `.deb` |

            ### First run

            ChatterLayer asks which **speech model** to download — models aren't
            bundled because they range from 40 MB to 2.3 GB and you only need
            one. **Medium (~128 MB)** is recommended and right for almost
            everyone. Models are stored in your user data folder and survive
            updates.

            You'll also need a Discord bot token — about two minutes to set up,
            no privileged intents required. See the README.

            ### These builds are unsigned

            Code signing certificates cost money, so the binaries aren't signed.
            What that means per platform:

            - **Windows** — SmartScreen warns on first launch. Choose
              *More info* → *Run anyway*.
            - **macOS** — Gatekeeper will refuse to open it, often reporting the
              app as "damaged". It isn't. Either right-click the app →
              *Open* → *Open*, or clear the quarantine flag:
              ```
              xattr -cr /Applications/ChatterLayer.app
              ```
            - **Linux** — mark the AppImage executable first:
              ```
              chmod +x ChatterLayer-*.AppImage
              ```

            If you'd rather not run unsigned binaries, build from source — it's
            four commands, see the README.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
