name: Release

# Builds ChatterLayer for Windows, macOS and Linux and attaches everything to a
# draft GitHub Release.
#
# To cut a release:
#   1. bump the version in package.json, src-tauri/Cargo.toml and
#      src-tauri/tauri.conf.json, and give it an entry in
#      src-tauri/whats-new.json
#   2. git tag v0.5.1 && git push origin v0.5.1
#
# Running it manually from the Actions tab:
#   - with a tag  -> builds and publishes a draft release for that tag
#   - no tag      -> builds artifacts only; the release job is skipped, because
#                    a release cannot be created without a tag to attach to
#
# Windows is the platform it's tested on. The macOS and Linux builds are built
# the same way from the same code and shipped for people to try and report on.
#
# Every platform also gets ChatterLayer-<version>-<platform>.zip: the app on its
# own, which the WidgetCake launcher installs. Windows keeps the name
# ChatterLayer-<version>-win.zip that the launcher has always looked for.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.5.1). Leave blank to build artifacts only.'
        required: false
        type: string

# Read-only by default. Building compiles every dependency, and there's no
# reason for that to hold a token that can write to the repository.
permissions:
  contents: read

# One release run per tag at a time; a second push of the same tag waits
# rather than racing the first to create the release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The installers take their version from the project files, not the tag, and
  # the update badge compares the two. A tag that disagrees fails here, before
  # five platforms spend time building.
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the project version
        if: github.ref_type == 'tag' || inputs.tag
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          for v in "$pkg" "$conf" "$cargo"; do
            if [ "$TAG" != "v$v" ]; then
              echo "::error::Tag $TAG does not match package.json ($pkg), tauri.conf.json ($conf) and Cargo.toml ($cargo). Bump the version, then tag."
              exit 1
            fi
          done
          echo "$TAG matches"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # actions/attest-build-provenance
      attestations: write
    strategy:
      # Windows is the tested platform. A failure on another must not stop it
      # shipping.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win
            runtimes: win32-x64
            bundles: nsis
          - name: macOS (Apple Silicon)
            os: macos-latest
            platform: macos-arm64
            runtimes: darwin-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS (Intel)
            os: macos-latest
            platform: macos-x64
            runtimes: darwin-x64
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux (x64)
            os: ubuntu-22.04
            platform: linux-x64
            runtimes: linux-x64
            bundles: appimage,deb
          - name: Linux (ARM64)
            os: ubuntu-22.04-arm
            platform: linux-arm64
            runtimes: linux-arm64
            bundles: appimage,deb

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # No Rust cache here on purpose: a tag's cache can't be restored by the
      # next tag, so saving one would only add minutes of upload to every
      # build.

      # The web view and tray library Tauri builds against, and D-Bus for the
      # keystore the bot token goes in.
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config cmake

      # The Tauri command-line tools; the window itself has no npm packages.
      - name: Install dependencies
        run: npm ci

      # libvosk and ONNX Runtime ship inside every build. Speech models do NOT:
      # they're 40 MB to 2.5 GB and the app downloads the one picked.
      - name: Fetch the speech runtimes
        run: node scripts/fetch-runtimes.js ${{ matrix.runtimes }}

      # No tests here: a tag is only ever cut from master, and master only
      # takes commits whose CI tests passed on all three systems.

      - name: Build
        run: npm run build -- --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # The installer under a stable name, and the app on its own for
      # WidgetCake, with the runtimes where the app looks for them.
      - name: Name the installers and zip the app
        run: |
          version=$(node -p "require('./package.json').version")
          base="ChatterLayer-$version"
          release="src-tauri/target/${{ matrix.target }}/release"
          release="${release//\/\//\/}"
          bundle="$release/bundle"
          mkdir -p out

          case "${{ matrix.platform }}" in
            win)
              cp "$bundle"/nsis/*-setup.exe "out/$base-Setup.exe"
              mkdir -p app/vosk app/onnxruntime
              cp "$release/chatterlayer.exe" app/ChatterLayer.exe
              cp vendor/runtime/vosk/* app/vosk/
              cp vendor/runtime/onnxruntime/* app/onnxruntime/
              (cd app && pwsh -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../out/$base-win.zip")
              ;;
            macos-*)
              cp "$bundle"/dmg/*.dmg "out/$base-${{ matrix.platform }}.dmg"
              # ditto keeps the bundle's permissions and structure intact.
              ditto -c -k --keepParent "$bundle"/macos/*.app "out/$base-${{ matrix.platform }}.zip"
              ;;
            linux-*)
              cp "$bundle"/appimage/*.AppImage "out/$base-${{ matrix.platform }}.AppImage"
              cp "$bundle"/deb/*.deb "out/$base-${{ matrix.platform }}.deb"
              mkdir -p app/vosk app/onnxruntime
              cp "$release/chatterlayer" app/ChatterLayer
              cp vendor/runtime/vosk/* app/vosk/
              cp vendor/runtime/onnxruntime/* app/onnxruntime/
              (cd app && zip -r -y "../out/$base-${{ matrix.platform }}.zip" .)
              ;;
          esac
          ls -la out

      # Cryptographic provenance: what built this file, from which commit and
      # workflow. `gh attestation verify <file>` checks it. Needs no signing
      # certificate.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatterlayer-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # cosign keyless signing via GitHub OIDC
    # Only when there's a tag to release. Runs even if one platform failed, so
    # a broken Linux build can't hold up a working Windows one. The release is
    # a draft: check what's attached before publishing.
    if: (github.ref_type == 'tag' || inputs.tag) && !cancelled()

    steps:
      - uses: actions/checkout@v7

      - name: Resolve the tag to publish
        id: tag
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag to release. Push a v* tag, or supply one when running manually."
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG"

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: chatterlayer-*
          merge-multiple: true

      - name: List what will be published
        run: ls -lah artifacts

      # The builds are unsigned, so give people a way to check a download is the
      # real one: a checksum file, signed keylessly with Sigstore (GitHub OIDC,
      # no key to manage). Verify with:
      #   cosign verify-blob --bundle SHA256SUMS.cosign.bundle \
      #     --certificate-identity-regexp 'https://github.com/ruptz/ChatterLayer/.+' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     SHA256SUMS
      #   sha256sum -c SHA256SUMS
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          find . -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -printf '%P\n' | sort | xargs -r sha256sum | tee SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS (keyless)
        working-directory: artifacts
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS

      # The in-app "What's new" card is the one place release notes are
      # written. A version with no entry gets no section, not an empty one.
      - name: Read this version's notes from whats-new.json
        id: notes
        run: |
          {
            echo 'md<<NOTES_EOF'
            node -e '
              const NOTES = require("./src-tauri/whats-new.json");
              const entry = NOTES.find((n) => n.version === process.argv[1].replace(/^v/, ""));
              if (entry) console.log(["### What’s new", "", ...entry.items.map((i) => `- ${i}`), ""].join("\n"));
            ' "${{ steps.tag.outputs.name }}"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Passed explicitly. Left to the action's default it reads github.ref,
          # which is a branch ref on a manual run and fails with
          # "Missing tag_name parameter".
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          draft: true # review before it goes public
          generate_release_notes: true
          name: ChatterLayer ${{ steps.tag.outputs.name }}
          body: |
            ## ChatterLayer ${{ steps.tag.outputs.name }}

            Live, colour-coded Discord voice captions for OBS. Free and fully
            offline — speech recognition runs on your own machine. No API keys,
            no accounts, no per-minute billing.

            ${{ steps.notes.outputs.md }}

            ### Download

            | Platform | File |
            |---|---|
            | Windows | `ChatterLayer-*-Setup.exe`, or `ChatterLayer-*-win.zip` to run without installing |
            | macOS, Apple Silicon | `ChatterLayer-*-macos-arm64.dmg` |
            | macOS, Intel | `ChatterLayer-*-macos-x64.dmg` |
            | Linux | `ChatterLayer-*-linux-x64.AppImage` or `.deb` (also `linux-arm64`) |

            The `.zip` files are what the WidgetCake launcher installs for you.

            Windows is where ChatterLayer is tested. The macOS and Linux builds
            come from the same code and should work, but haven't been run on
            those systems by us — if something's wrong, please
            [open an issue](https://github.com/ruptz/ChatterLayer/issues/new/choose).

            Installing over 0.4 or earlier on Windows removes the old version
            first. Your settings, bot token and downloaded models carry over.
            On macOS and Linux, paste your bot token once more.

            ### First run

            ChatterLayer asks which **speech model** to download — models aren't
            bundled because they range from 40 MB to 2.5 GB and you only need
            one. It marks the one that suits your PC: **Parakeet TDT 0.6B**
            (2.5 GB, the most accurate) if you have 16 GB of RAM or more, or
            **Moonshine Base** (251 MB) on lighter machines. Models are stored
            in your user data folder and survive updates.

            To caption a Discord call you'll also need a bot token — about two
            minutes to set up, no privileged intents required. See the README.
            Captioning only your own mic needs no bot at all.

            ### About the "unknown developer" warnings

            ChatterLayer is free and unfunded, and code-signing certificates
            cost money each year, so these builds aren't signed. Your system
            will say so on first launch:

            - **Windows** — SmartScreen shows a blue box. Choose *More info*,
              then *Run anyway*. It stops once a release has enough downloads.
            - **macOS** — Gatekeeper may say the app is "damaged". It isn't;
              that's the quarantine flag every unsigned download gets. Run
              `xattr -dr com.apple.quarantine /Applications/ChatterLayer.app`
              once, then open it normally.
            - **Linux** — mark the AppImage executable first:
              `chmod +x ChatterLayer-*.AppImage`. The bot token goes in your
              desktop's keyring (GNOME Keyring or KWallet).

            **Verify your download.** Every release ships `SHA256SUMS` (signed
            with Sigstore) and each file carries build provenance:

            ```
            sha256sum -c SHA256SUMS
            gh attestation verify ChatterLayer-*-Setup.exe --repo ruptz/ChatterLayer
            ```

            Or skip the binaries entirely and build from source; see the README.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
