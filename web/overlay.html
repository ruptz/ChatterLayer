<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChatterLayer Overlay</title>
    <style>
      /* ChatterLayer - OBS browser source overlay
         Background MUST stay fully transparent so OBS composites it over the
         scene. Never set an opaque background on html/body. */

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: var(--font, "Segoe UI", Inter, system-ui, -apple-system, sans-serif);
        -webkit-font-smoothing: antialiased;
      }

      /* The styling settings land on #stage as data attributes and custom
         properties, so a user's own CSS can read or override every one. */
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* newest caption sits at the bottom */
        align-items: flex-start;
        gap: 8px;
        padding: 24px;
        box-sizing: border-box;
      }
      #stage[data-pos="top"] {
        justify-content: flex-start;
      }
      #stage[data-align="center"] {
        align-items: center;
        text-align: center;
      }
      #stage[data-align="right"] {
        align-items: flex-end;
        text-align: right;
      }

      .caption {
        --color: #4ecdc4;
        max-width: var(--max-width, 92%);
        padding: 10px 16px;
        border-radius: 10px;
        border-left: 5px solid var(--color);
        background: rgba(8, 10, 14, var(--bg, 0.72));
        /* Blur keeps text legible over busy gameplay without going fully opaque. */
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: var(--text-color, #fff);
        font-size: var(--size, 30px);
        line-height: 1.32;
        /* Double shadow: a tight dark halo for contrast on light scenes, plus a
           soft drop for depth. An outline, when set, is prepended to it. */
        text-shadow: var(--shadow, 0 0 4px rgba(0, 0, 0, 0.95), 0 2px 6px rgba(0, 0, 0, 0.65));
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
        animation: rise 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        transition: opacity 0.45s ease, transform 0.45s ease;
        /* A thick outline eats the gaps between letters; give them back. */
        letter-spacing: calc(var(--outline, 0px) / 4);
        word-spacing: calc(var(--outline, 0px) / 2);
        word-wrap: break-word;
      }

      /* Broadcast subtitles: a flat box, no accent bar. */
      #stage[data-look="box"] .caption {
        padding: 6px 14px;
        border-radius: 3px;
        border-left: 0;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      /* Bare text, carried by its outline. */
      #stage[data-look="text"] .caption {
        padding: 0 4px;
        border-left: 0;
        background: none;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .caption.leaving {
        opacity: 0;
        transform: translateY(-8px);
      }

      .caption.partial {
        opacity: 0.75;
      }

      .speaker {
        color: var(--color);
        font-weight: 700;
        margin-right: 10px;
        /* Slightly heavier halo — the colour carries the speaker identity, so it
           must survive compression and bright backgrounds. */
        text-shadow: var(--shadow-name, 0 0 5px rgba(0, 0, 0, 1), 0 2px 5px rgba(0, 0, 0, 0.8));
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Only visible when you open the overlay in a normal browser; OBS users
         never see it because it hides as soon as the socket connects. */
      #offline {
        position: absolute;
        left: 24px;
        bottom: 24px;
        padding: 10px 16px;
        border-radius: 10px;
        background: rgba(120, 20, 20, 0.85);
        color: #fff;
        font-size: 15px;
      }
      #offline.hide {
        display: none;
      }
    </style>
    <!-- @font-face rules for the fonts folder, then the user's own CSS, so it
         comes after and wins every tie. -->
    <style id="fonts"></style>
    <style id="custom"></style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="offline">ChatterLayer: connecting…</div>

    <script>
      (() => {
        'use strict';

        const stage = document.getElementById('stage');
        const offline = document.getElementById('offline');
        const fontRules = document.getElementById('fonts');
        const customCss = document.getElementById('custom');
        const params = new URLSearchParams(location.search);
        // The app's own style preview: sample lines that never expire, and
        // not counted as OBS by the server.
        const preview = params.has('preview');

        const DEFAULTS = {
          fontSize: 30,
          captionLifetimeMs: 7000,
          maxLines: 4,
          showPartials: true,
          showSpeakerName: true,
          look: 'card',
          position: 'bottom',
          align: 'left',
          background: 72,
          maxWidth: 92,
          outline: 0,
          font: '',
          textColor: '#ffffff',
          customCss: '',
        };
        const FALLBACK_FONTS = '"Segoe UI", Inter, system-ui, -apple-system, sans-serif';

        /**
         * Per-viewer overrides, read from the query string.
         *
         * The host's sliders drive everyone by default, which is wrong the
         * moment several people share one overlay: text sized for a 1080p face
         * cam is not text sized for a full-screen gameplay scene. Anything set
         * here wins over the host's settings and keeps winning when they change
         * theirs mid-stream, so each streamer tunes their own browser source
         * without touching anyone else's.
         *
         *   ?size=42&hold=5&lines=2&partials=0&names=0&pos=top&align=center
         *
         * `css=0` drops the host's custom CSS for this one source.
         */
        function readOverrides() {
          const out = {};
          const num = (key, min, max) => {
            if (!params.has(key)) return null;
            const v = Number(params.get(key));
            return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : null;
          };
          const bool = (key) => {
            if (!params.has(key)) return null;
            const v = params.get(key).toLowerCase();
            return v !== '0' && v !== 'false' && v !== 'no';
          };

          const size = num('size', 8, 200);
          if (size !== null) out.fontSize = size;
          // Seconds in the URL — nobody wants to type milliseconds by hand.
          const hold = num('hold', 0.5, 120);
          if (hold !== null) out.captionLifetimeMs = Math.round(hold * 1000);
          const lines = num('lines', 1, 20);
          if (lines !== null) out.maxLines = Math.round(lines);
          const partials = bool('partials');
          if (partials !== null) out.showPartials = partials;
          const names = bool('names');
          if (names !== null) out.showSpeakerName = names;
          const pos = params.get('pos');
          if (pos === 'top' || pos === 'bottom') out.position = pos;
          const align = params.get('align');
          if (['left', 'center', 'right'].includes(align)) out.align = align;
          if (bool('css') === false) out.customCss = '';
          return out;
        }

        const overrides = readOverrides();

        /** Live settings: server values, with this viewer's overrides on top. */
        let settings = { overlay: { ...DEFAULTS, ...overrides }, fonts: [] };

        /** Fold an incoming server payload in without losing the overrides. */
        function mergeSettings(incoming) {
          const from = (incoming && incoming.overlay) || {};
          const fonts = (incoming && incoming.fonts) || [];
          settings = { overlay: { ...DEFAULTS, ...from, ...overrides }, fonts };
          applySettings();
        }

        /** userId -> element currently showing that speaker's partial text. */
        const partials = new Map();

        /** A ring of hard shadows reads as an outline on any scene. */
        function outlineRing(px) {
          if (!(px > 0)) return '';
          const ring = [];
          for (let i = 0; i < 16; i++) {
            const a = (i / 16) * Math.PI * 2;
            ring.push(`${(Math.cos(a) * px).toFixed(2)}px ${(Math.sin(a) * px).toFixed(2)}px 0 #000`);
          }
          return `${ring.join(', ')}, `;
        }

        /** Bare family names: quotes or backslashes would break out of the rule. */
        const family = (name) => String(name).replace(/["\\\n\r]/g, '').trim();

        /**
         * Fonts dropped into the app's fonts folder, served by the app so a
         * co-streamer's OBS gets them too. The family is the file name without
         * its extension. The access key rides along, as on the socket.
         */
        function applyFonts() {
          const key = params.get('k');
          const query = key ? `?k=${encodeURIComponent(key)}` : '';
          fontRules.textContent = settings.fonts
            .map((file) => {
              const name = family(file.replace(/\.[^.]+$/, ''));
              return `@font-face { font-family: "${name}"; src: url("/fonts/${encodeURIComponent(file)}${query}"); }`;
            })
            .join('\n');
        }

        function applySettings() {
          const o = settings.overlay;
          const root = document.documentElement.style;
          root.setProperty('--size', `${o.fontSize}px`);
          root.setProperty('--bg', String(Math.min(100, Math.max(0, Number(o.background))) / 100));
          root.setProperty('--max-width', `${Math.min(100, Math.max(20, Number(o.maxWidth)))}%`);
          root.setProperty('--text-color', o.textColor || '#ffffff');
          const name = family(o.font || '');
          root.setProperty('--font', name ? `"${name}", ${FALLBACK_FONTS}` : FALLBACK_FONTS);
          const outline = Math.min(12, Number(o.outline) || 0);
          root.setProperty('--outline', `${outline}px`);
          const ring = outlineRing(outline);
          root.setProperty('--shadow', `${ring}0 0 4px rgba(0, 0, 0, 0.95), 0 2px 6px rgba(0, 0, 0, 0.65)`);
          root.setProperty('--shadow-name', `${ring}0 0 5px rgba(0, 0, 0, 1), 0 2px 5px rgba(0, 0, 0, 0.8)`);
          stage.dataset.look = o.look;
          stage.dataset.pos = o.position;
          stage.dataset.align = o.align;
          for (const node of stage.children) {
            node.style.setProperty('--size', `${o.fontSize}px`);
          }
          applyFonts();
          // textContent, never innerHTML: it stays a stylesheet, never markup.
          customCss.textContent = o.customCss || '';
          if (preview) showSamples();
          else trim();
        }

        const SAMPLES = [
          { userId: 'sample-1', username: 'Sam', color: '#4ecdc4', text: 'Okay, that boss fight was way harder than it looked.', isFinal: true },
          { userId: 'sample-2', username: 'Mira', color: '#ff8a5c', text: 'You say that every single time we get to this part.', isFinal: true },
          { userId: 'sample-3', username: 'Jonah', color: '#c792ea', text: 'Wait, which way is the', isFinal: false },
        ];

        /** The preview's fixed lines, rebuilt whenever the style changes. */
        function showSamples() {
          const show = settings.overlay.showPartials ? SAMPLES : SAMPLES.filter((s) => s.isFinal);
          stage.replaceChildren(...show.slice(-settings.overlay.maxLines).map((s) => build(s, !s.isFinal)));
        }

        function trim() {
          const max = settings.overlay.maxLines || 4;
          while (stage.children.length > max) stage.firstChild.remove();
        }

        function build(cap, isPartial) {
          const div = document.createElement('div');
          div.className = `caption${isPartial ? ' partial' : ''}`;
          div.style.setProperty('--color', cap.color || '#4ecdc4');
          div.style.setProperty('--size', `${settings.overlay.fontSize}px`);
          // Lets custom CSS style one person: .caption[data-user="1234"]
          div.dataset.user = cap.userId || '';

          if (settings.overlay.showSpeakerName) {
            const who = document.createElement('span');
            who.className = 'speaker';
            who.textContent = cap.username;
            div.appendChild(who);
          }
          const text = document.createElement('span');
          text.className = 'text';
          text.textContent = cap.text;
          div.appendChild(text);
          return div;
        }

        /** Fade a caption out, then remove it. */
        function expire(node, delay) {
          const timer = setTimeout(() => {
            node.classList.add('leaving');
            setTimeout(() => node.remove(), 500);
          }, delay);
          node.dataset.timer = String(timer);
        }

        function clearTimer(node) {
          if (node.dataset.timer) clearTimeout(Number(node.dataset.timer));
        }

        function onCaption(cap) {
          if (!cap.isFinal) {
            if (!settings.overlay.showPartials) return;
            // Update the speaker's in-progress line in place rather than
            // appending a new line per partial.
            let node = partials.get(cap.userId);
            if (node && node.isConnected) {
              clearTimer(node);
              node.replaceWith((node = build(cap, true)));
            } else {
              node = build(cap, true);
              stage.appendChild(node);
            }
            partials.set(cap.userId, node);
            // Safety net: if the speaker vanishes mid-word, don't leave the
            // partial on screen forever.
            expire(node, settings.overlay.captionLifetimeMs + 4000);
            trim();
            return;
          }

          // Final text supersedes that speaker's partial line.
          const existing = partials.get(cap.userId);
          if (existing && existing.isConnected) {
            clearTimer(existing);
            existing.remove();
          }
          partials.delete(cap.userId);

          const node = build(cap, false);
          stage.appendChild(node);
          expire(node, settings.overlay.captionLifetimeMs);
          trim();
        }

        // ------------------------------------------------------ socket ---

        let ws = null;
        let retry = 0;

        /** Loopback: the host's own OBS, where plain HTTP never leaves the box. */
        function isLocalHost() {
          const h = location.hostname;
          return h === '127.0.0.1' || h === 'localhost' || h === '::1' || h === '';
        }

        function connect() {
          // The access key rides in this URL. If the page reached us over plain
          // HTTP from anywhere but this machine, something has gone wrong with
          // the tunnel — refuse rather than put the key on the wire in clear
          // text where the network between here and Cloudflare can read it.
          if (location.protocol !== 'https:' && !isLocalHost()) {
            offline.classList.remove('hide');
            offline.textContent =
              'ChatterLayer: refusing to send the access key over an insecure connection — use the https:// link.';
            return;
          }

          const proto = location.protocol === 'https:' ? 'wss' : 'ws';
          // Carry the access key onto the socket too. Over a tunnel the upgrade
          // is gated exactly like the page request, and the key only ever lives
          // in this URL — so re-read it rather than storing a copy anywhere.
          const key = params.get('k');
          const query = new URLSearchParams();
          if (key) query.set('k', key);
          if (preview) query.set('preview', '1');
          const qs = query.toString();
          ws = new WebSocket(`${proto}://${location.host}/${qs ? `?${qs}` : ''}`);

          ws.onopen = () => {
            retry = 0;
            offline.classList.add('hide');
          };

          ws.onmessage = (event) => {
            let msg;
            try {
              msg = JSON.parse(event.data);
            } catch {
              return;
            }
            switch (msg.type) {
              case 'hello':
              case 'settings':
                mergeSettings(msg.settings);
                return;
              case 'caption':
                return preview ? undefined : onCaption(msg);
              case 'captionCleared': {
                const node = partials.get(msg.userId);
                if (node && node.isConnected) {
                  clearTimer(node);
                  node.remove();
                }
                partials.delete(msg.userId);
                return;
              }
              case 'clear':
                if (preview) return;
                stage.innerHTML = '';
                partials.clear();
                return;
              default:
                return;
            }
          };

          ws.onclose = (event) => {
            offline.classList.remove('hide');

            // 4401: the host rotated the access key. Retrying cannot fix that,
            // and a browser source silently hammering a dead link forever is
            // worse than saying what happened.
            if (event.code === 4401) {
              offline.textContent =
                'ChatterLayer: this link’s access key was revoked — ask the host for a new one.';
              return;
            }

            offline.textContent = 'ChatterLayer: reconnecting…';
            // Back off gently, but keep retrying forever — OBS sources are
            // often loaded before the app is running.
            retry = Math.min(retry + 1, 10);
            setTimeout(connect, 500 + retry * 500);
          };

          ws.onerror = () => ws.close();
        }

        applySettings();
        connect();
      })();
    </script>
  </body>
</html>
